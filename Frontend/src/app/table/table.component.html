<div class="table-wrap">
  <table mat-table [dataSource]="exercises">
    <ng-container matColumnDef="id">
      <th mat-header-cell *matHeaderCellDef>#</th>
      <td mat-cell *matCellDef="let exercise">{{ exercise.id }}</td>
    </ng-container>

    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef>Ejercicio</th>
      <td mat-cell *matCellDef="let exercise">{{ exercise.name }}</td>
    </ng-container>

    <ng-container matColumnDef="focus">
      <th mat-header-cell *matHeaderCellDef>Habilidad</th>
      <td mat-cell *matCellDef="let exercise">{{ exercise.focus }}</td>
    </ng-container>

    <ng-container matColumnDef="duration">
      <th mat-header-cell *matHeaderCellDef>Duración</th>
      <td mat-cell *matCellDef="let exercise">{{ exercise.duration }} min</td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
  </table>
</div>
